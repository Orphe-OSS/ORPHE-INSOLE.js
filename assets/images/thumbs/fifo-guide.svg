<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img"
  aria-label="FIFO Guide: device buffer, serial-addressed pull, and a serial continuity timeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f9fa" />
      <stop offset="1" stop-color="#e9ecef" />
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" />

  <text x="32" y="52" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#212529">
    FIFO Guide
  </text>
  <text x="32" y="78" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6c757d">
    Buffered recording, continuity, and the ~30 s limit
  </text>

  <!-- device buffer -->
  <rect x="32" y="104" width="250" height="96" rx="10" fill="#ffffff" stroke="#fd7e14" stroke-width="2" />
  <text x="48" y="128" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fd7e14">
    INSOLE buffer ≈ 30 s
  </text>
  <g fill="#ffe5d0" stroke="#fd7e14" stroke-width="1">
    <rect x="48" y="142" width="20" height="40" rx="3" />
    <rect x="73" y="142" width="20" height="40" rx="3" />
    <rect x="98" y="142" width="20" height="40" rx="3" />
    <rect x="123" y="142" width="20" height="40" rx="3" />
    <rect x="148" y="142" width="20" height="40" rx="3" />
    <rect x="173" y="142" width="20" height="40" rx="3" />
    <rect x="198" y="142" width="20" height="40" rx="3" />
    <rect x="223" y="142" width="20" height="40" rx="3" />
    <rect x="248" y="142" width="20" height="40" rx="3" />
  </g>

  <!-- pull arrow -->
  <line x1="292" y1="152" x2="352" y2="152" stroke="#0d6efd" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="322" y="142" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0d6efd">
    request
  </text>
  <line x1="352" y1="176" x2="292" y2="176" stroke="#198754" stroke-width="2.5" marker-end="url(#arrowG)" />
  <text x="322" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#198754">
    serial 1200…
  </text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0d6efd" />
    </marker>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#198754" />
    </marker>
  </defs>

  <!-- host -->
  <rect x="358" y="104" width="250" height="96" rx="10" fill="#ffffff" stroke="#0d6efd" stroke-width="2" />
  <text x="374" y="128" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d6efd">
    Browser (pull + re-request)
  </text>
  <text x="374" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#495057">
    gyro / acc / 6ch pressure
  </text>
  <text x="374" y="172" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#adb5bd">
    no quaternion
  </text>
  <text x="374" y="190" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#495057">
    drain after stop → CSV
  </text>

  <!-- continuity timeline -->
  <text x="32" y="240" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#212529">
    Serial continuity timeline
  </text>
  <rect x="32" y="250" width="576" height="44" rx="5" fill="#198754" />
  <rect x="284" y="250" width="16" height="44" fill="#dc3545" />
  <rect x="412" y="250" width="6" height="44" fill="#dc3545" />
  <text x="32" y="314" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#198754">received</text>
  <text x="92" y="314" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#dc3545">missing 1200–1208</text>

  <!-- verdict chips -->
  <rect x="32" y="332" width="128" height="32" rx="6" fill="#198754" />
  <text x="96" y="353" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13"
    font-weight="700" fill="#ffffff">PASS / no loss</text>
  <rect x="170" y="332" width="150" height="32" rx="6" fill="#ffc107" />
  <text x="245" y="353" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13"
    font-weight="700" fill="#212529">WARN / over 30 s</text>
  <rect x="330" y="332" width="128" height="32" rx="6" fill="#dc3545" />
  <text x="394" y="353" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13"
    font-weight="700" fill="#ffffff">FAIL / loss</text>
</svg>
