<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Step Analysis and realtime raw data example</title>
  <desc id="desc">Two compact charts above a left and right gait analysis table.</desc>
  <rect width="640" height="400" fill="#edf1f4"/>
  <rect x="0" y="0" width="640" height="70" fill="#ffffff"/>
  <text x="28" y="28" fill="#66717a" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">TOOLKIT EXAMPLE / REALTIME FULL + STEP</text>
  <text x="28" y="54" fill="#17212a" font-family="Arial, sans-serif" font-size="24" font-weight="700">Step Analysis + RAW Data</text>
  <rect x="28" y="88" width="584" height="94" rx="10" fill="#0b141b"/>
  <text x="42" y="108" fill="#7fa4ff" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">LAST 10 STEPS</text>
