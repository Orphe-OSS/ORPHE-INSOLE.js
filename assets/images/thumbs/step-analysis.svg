  <rect x="28" y="266" width="584" height="30" rx="10" fill="#e7ecef"/>
  <path d="M28 296 H612 M28 323 H612 M28 350 H612" stroke="#d8e0e5"/>
  <path d="M250 266 V378 M405 266 V378" stroke="#d8e0e5"/>
