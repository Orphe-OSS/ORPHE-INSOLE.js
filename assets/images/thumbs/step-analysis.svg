  <text x="450" y="286" fill="#b94735" font-family="Arial, sans-serif" font-size="11" font-weight="700">Right side</text>
  <text x="42" y="315" fill="#26323b" font-family="Arial, sans-serif" font-size="11">Gait speed (m/s)</text>
