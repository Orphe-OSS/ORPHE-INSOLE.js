<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">UDON stepping game example</title>
  <desc id="desc">A stepping game screen on an orange background: an off-white udon dough blob being kneaded above rounded noodles, with a chewiness meter and per-step rating chips.</desc>

  <!-- game stage background (p5: background(225, 92, 58)) -->
  <rect width="640" height="400" fill="#e15c3a"/>

  <!-- header -->
  <text x="24" y="36" fill="#1c1c1c" font-family="Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="1">UDON</text>
  <text x="24" y="52" fill="#3a1408" font-family="Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="3">REALTIME PRESSURE + IMU / MODE 3 200Hz</text>
  <rect x="540" y="24" width="76" height="20" rx="10" fill="#1f7a4d"/>
  <text x="578" y="38" fill="#e6fff1" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="2" text-anchor="middle">LIVE</text>

  <!-- chewiness meter -->
  <text x="24" y="80" fill="#3a1408" font-family="Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="2">CHEWINESS / もちもち度</text>
  <text x="616" y="82" fill="#1c1c1c" font-family="Arial, sans-serif" font-size="15" font-weight="800" text-anchor="end">63%</text>
  <rect x="24" y="88" width="592" height="10" rx="5" fill="#b5432a"/>
  <rect x="24" y="88" width="373" height="10" rx="5" fill="#ffd166"/>

  <!-- dough being kneaded (p5: doughColor = color(235,235,235), deformed circle) -->
  <g transform="translate(320 224) scale(0.84) translate(-320 -196)">
    <ellipse cx="320" cy="196" rx="128" ry="96" fill="#c9462c" opacity="0.35"/>
    <path d="M320 96 C372 92 424 118 442 158 C462 200 446 248 404 274 C362 300 296 302 252 282 C206 260 186 214 200 170 C214 126 268 100 320 96 Z" fill="#ebebeb"/>
    <path d="M320 96 C372 92 424 118 442 158 C452 180 452 202 444 222 C420 196 380 186 336 190 C286 194 240 214 214 246 C196 218 190 190 200 170 C214 126 268 100 320 96 Z" fill="#f7f7f7"/>
    <ellipse cx="276" cy="164" rx="14" ry="9" fill="#dcdcdc"/>
    <ellipse cx="366" cy="238" rx="20" ry="12" fill="#dcdcdc"/>
    <ellipse cx="258" cy="228" rx="14" ry="9" fill="#dcdcdc"/>
  </g>

  <!-- footstep marks: left / right stomp -->
  <g opacity="0.9">
    <ellipse cx="150" cy="300" rx="26" ry="15" fill="#ffd166"/>
    <text x="150" y="305" fill="#7a3312" font-family="Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle">L</text>
    <ellipse cx="490" cy="300" rx="26" ry="15" fill="#ffe9a8"/>
    <text x="490" y="305" fill="#7a3312" font-family="Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle">R</text>
  </g>

  <!-- noodles (p5: vertical rounded rects, noodleWidth 40) -->
  <g fill="#ebebeb">
    <rect x="24" y="330" width="40" height="70" rx="8"/>
    <rect x="76" y="344" width="40" height="56" rx="8"/>
    <rect x="128" y="336" width="40" height="64" rx="8"/>
    <rect x="180" y="352" width="40" height="48" rx="8"/>
    <rect x="232" y="330" width="40" height="70" rx="8"/>
    <rect x="284" y="342" width="40" height="58" rx="8"/>
    <rect x="336" y="334" width="40" height="66" rx="8"/>
    <rect x="388" y="350" width="40" height="50" rx="8"/>
    <rect x="440" y="338" width="40" height="62" rx="8"/>
    <rect x="492" y="330" width="40" height="70" rx="8"/>
    <rect x="544" y="346" width="40" height="54" rx="8"/>
    <rect x="596" y="336" width="20" height="64" rx="8"/>
  </g>

  <!-- rating chips -->
  <g font-family="Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="1">
    <rect x="24" y="112" width="96" height="20" rx="10" fill="#1c1c1c" opacity="0.72"/>
    <text x="72" y="126" fill="#7dffbe" text-anchor="middle">PERFECT 4</text>
    <rect x="128" y="112" width="110" height="20" rx="10" fill="#1c1c1c" opacity="0.72"/>
    <text x="183" y="126" fill="#b8f27a" text-anchor="middle">EXCELLENT 7</text>
    <rect x="246" y="112" width="78" height="20" rx="10" fill="#1c1c1c" opacity="0.72"/>
    <text x="285" y="126" fill="#ffd166" text-anchor="middle">GOOD 6</text>
    <rect x="332" y="112" width="76" height="20" rx="10" fill="#1c1c1c" opacity="0.72"/>
    <text x="370" y="126" fill="#ffb3a0" text-anchor="middle">WEAK 2</text>
    <rect x="416" y="112" width="60" height="20" rx="10" fill="#1c1c1c" opacity="0.5"/>
    <text x="446" y="126" fill="#f0d6cd" text-anchor="middle">19 steps</text>
  </g>
</svg>
